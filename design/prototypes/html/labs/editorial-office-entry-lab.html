<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>世界未解之谜周刊 · 编辑部入口实验</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05080b;
      --ink: #f6f2df;
      --paper: #ead9ac;
      --paper-bright: #fff1c9;
      --muted: rgba(246, 242, 223, 0.68);
      --weak: rgba(246, 242, 223, 0.42);
      --line: rgba(246, 242, 223, 0.18);
      --line-strong: rgba(246, 242, 223, 0.34);
      --cyan: #20c3d7;
      --cyan-dark: #0d5f75;
      --red: #ed382d;
      --red-dark: #8a1e1a;
      --yellow: #f1b83a;
      --green: #6fbf82;
      --black: #030507;
      --panel: rgba(8, 13, 16, 0.88);
      --radius: 8px;
      font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      min-width: 1180px;
      overflow: hidden;
    }

    a,
    button {
      font: inherit;
      color: inherit;
    }

    a { text-decoration: none; }

    button {
      border: 0;
      cursor: pointer;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .office-shell {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 760px 520px at 17% 32%, rgba(32, 195, 215, 0.12), transparent 62%),
        radial-gradient(ellipse 640px 460px at 84% 16%, rgba(237, 56, 45, 0.16), transparent 58%),
        linear-gradient(180deg, #080d11 0%, #05080b 56%, #030506 100%);
    }

    .office-shell::before,
    .office-shell::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
    }

    .office-shell::before {
      background:
        linear-gradient(90deg, rgba(32, 195, 215, 0.06) 1px, transparent 1px),
        linear-gradient(180deg, rgba(237, 56, 45, 0.045) 1px, transparent 1px);
      background-size: 88px 88px;
      opacity: 0.56;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.8), transparent 82%);
    }

    .office-shell::after {
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.028) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0 2px, transparent 2px 10px);
      opacity: 0.55;
      mix-blend-mode: screen;
    }

    .topbar {
      position: absolute;
      inset: 18px 24px auto;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
    }

    .lab-note {
      min-width: 0;
      color: rgba(246, 242, 223, 0.5);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .clean-capture .topbar {
      display: none;
    }

    .clean-capture .office-stage {
      height: calc(100vh - 48px);
      padding-top: 0;
    }

    .ghost-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid rgba(246, 242, 223, 0.18);
      border-radius: var(--radius);
      background: rgba(3, 5, 7, 0.5);
      color: rgba(246, 242, 223, 0.72);
      font-size: 12px;
      font-weight: 900;
    }

    .ghost-link:hover,
    .ghost-link:focus-visible {
      border-color: rgba(32, 195, 215, 0.72);
      color: var(--ink);
      outline: 0;
    }

    .office-stage {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 382px;
      gap: 24px;
      width: min(1500px, calc(100vw - 64px));
      height: calc(100vh - 48px);
      margin: 24px auto;
      padding-top: 52px;
    }

    .room {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(246, 242, 223, 0.16);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(246, 242, 223, 0.04), transparent 38%),
        linear-gradient(90deg, rgba(32, 195, 215, 0.08), transparent 36%),
        #091014;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.42),
        inset 0 0 0 1px rgba(255, 255, 255, 0.025);
    }

    .back-wall {
      position: absolute;
      inset: 0 0 34%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 42%),
        linear-gradient(90deg, transparent 0 47%, rgba(237, 56, 45, 0.09) 47% 48%, transparent 48%),
        repeating-linear-gradient(0deg, rgba(246, 242, 223, 0.045) 0 1px, transparent 1px 35px),
        #0c1519;
    }

    .floor {
      position: absolute;
      inset: 64% 0 0;
      background:
        linear-gradient(180deg, rgba(3, 5, 7, 0.1), rgba(3, 5, 7, 0.82)),
        repeating-linear-gradient(90deg, rgba(246, 242, 223, 0.07) 0 2px, transparent 2px 92px),
        #081015;
      transform: skewY(-2deg);
      transform-origin: left top;
    }

    .scene-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.36));
    }

    .scene-art-cover {
      object-fit: cover;
    }

    .masthead-sign {
      position: absolute;
      left: 30px;
      top: 30px;
      width: 410px;
      height: 142px;
    }

    .masthead-sign b {
      display: block;
      color: var(--paper-bright);
      font-size: 28px;
      font-weight: 950;
      line-height: 0.98;
      text-shadow:
        2px -1px 0 rgba(32, 195, 215, 0.45),
        -2px 2px 0 rgba(237, 56, 45, 0.45);
    }

    .masthead-sign span {
      display: block;
      margin-top: 8px;
      color: rgba(246, 242, 223, 0.68);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .topic-board {
      position: absolute;
      left: 34px;
      top: 156px;
      width: 414px;
      height: 244px;
      padding: 0;
      transform: rotate(0.5deg);
    }

    .topic-board .scene-art {
      position: absolute;
      inset: 0;
    }

    .topic-board .scene-art-cover {
      object-fit: fill;
    }

    .topic-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .board-thread {
      position: absolute;
      height: 2px;
      background: rgba(237, 56, 45, 0.72);
      box-shadow: 0 0 8px rgba(237, 56, 45, 0.3);
      transform-origin: left center;
    }

    .board-thread.one { left: 132px; top: 112px; width: 106px; transform: rotate(12deg); }
    .board-thread.two { left: 222px; top: 126px; width: 86px; transform: rotate(48deg); }
    .board-thread.three { left: 256px; top: 164px; width: 58px; transform: rotate(-6deg); }

    .board-sticker {
      position: absolute;
      margin: 0;
      color: #14100b;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.22;
      text-shadow: none;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.32));
    }

    .sticker-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    .sticker-text {
      position: relative;
      z-index: 1;
      display: block;
      padding: 20px 14px 10px;
    }

    .sticker-text b {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 950;
    }

    .board-sticker.recap {
      left: 56px;
      top: 54px;
      width: 112px;
      height: 82px;
      transform: rotate(-5deg);
    }

    .board-sticker.oldline {
      left: 202px;
      top: 54px;
      width: 118px;
      height: 78px;
      transform: rotate(4deg);
    }

    .board-sticker.signal {
      left: 128px;
      top: 126px;
      width: 138px;
      height: 74px;
      transform: rotate(-1deg);
    }

    .board-sticker.signal .sticker-text {
      padding: 16px 16px 8px;
    }

    .board-sticker.nextstep {
      left: 270px;
      top: 150px;
      width: 128px;
      height: 44px;
      color: var(--paper-bright);
      transform: rotate(3deg);
    }

    .board-sticker.nextstep .sticker-text {
      padding: 9px 12px;
    }

    .board-sticker.nextstep .sticker-text b {
      color: var(--paper-bright);
    }

    .topic-board h2,
    .broadcast-station h2,
    .press-machine h2 {
      color: var(--paper-bright);
      font-size: 14px;
      font-weight: 950;
      letter-spacing: 0;
    }

    .string-map {
      position: relative;
      height: 220px;
      margin-top: 14px;
    }

    .pin {
      position: absolute;
      display: grid;
      place-items: center;
      width: 94px;
      min-height: 58px;
      padding: 8px;
      border: 1px solid rgba(246, 242, 223, 0.36);
      background: #e5d6ad;
      color: #101010;
      font-size: 12px;
      font-weight: 950;
      line-height: 1.2;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.26);
    }

    .pin::before {
      position: absolute;
      top: -6px;
      left: 50%;
      width: 10px;
      height: 10px;
      content: "";
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 12px rgba(237, 56, 45, 0.7);
      transform: translateX(-50%);
    }

    .pin.one { left: 4px; top: 4px; transform: rotate(-4deg); }
    .pin.two { right: 16px; top: 22px; transform: rotate(3deg); }
    .pin.three { left: 110px; top: 126px; transform: rotate(-1deg); }

    .string {
      position: absolute;
      height: 2px;
      background: rgba(237, 56, 45, 0.76);
      box-shadow: 0 0 10px rgba(237, 56, 45, 0.26);
      transform-origin: left center;
    }

    .string.a { left: 84px; top: 62px; width: 156px; transform: rotate(8deg); }
    .string.b { left: 180px; top: 82px; width: 94px; transform: rotate(102deg); }
    .string.c { left: 88px; top: 92px; width: 142px; transform: rotate(44deg); }

    .broadcast-station {
      position: absolute;
      right: 42px;
      top: 42px;
      width: 344px;
      height: 218px;
      overflow: visible;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      box-shadow: none;
      transform: rotate(-0.9deg);
    }

    .broadcast-button {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
    }

    .broadcast-button:hover,
    .broadcast-button:focus-visible {
      outline: 2px solid rgba(246, 242, 223, 0.74);
      outline-offset: 3px;
    }

    .broadcast-art {
      position: absolute;
      left: -22px;
      top: -10px;
      width: calc(100% + 44px);
      height: auto;
      object-fit: contain;
      opacity: 0.94;
      filter: saturate(0.92) contrast(1.05);
    }

    .broadcast-caption {
      position: absolute;
      left: 30px;
      right: 82px;
      bottom: 18px;
      z-index: 2;
      padding: 8px 10px 9px 12px;
      border-left: 5px solid var(--cyan);
      background: rgba(3, 5, 7, 0.82);
      color: rgba(246, 242, 223, 0.78);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.32;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.26);
    }

    .broadcast-caption strong {
      display: block;
      color: var(--paper-bright);
      font-size: 13px;
      font-weight: 950;
    }

    .broadcast-caption span {
      display: block;
      margin-top: 3px;
    }

    .anomaly-monitor {
      position: absolute;
      right: 56px;
      top: 304px;
      width: 342px;
      height: 224px;
      z-index: 1;
      display: block;
      opacity: 0.92;
    }

    .monitor-frame {
      position: relative;
      overflow: visible;
      height: 100%;
      min-height: 0;
      padding: 12px 12px 16px;
      border: 0;
      border-radius: 4px;
      background:
        linear-gradient(180deg, #221f1b, #0b0d0d 72%),
        #090c0d;
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.34),
        0 0 0 1px rgba(246, 242, 223, 0.16),
        inset 0 0 0 2px rgba(32, 195, 215, 0.12),
        inset 0 -12px 0 rgba(3, 5, 7, 0.74);
    }

    .monitor-frame::before,
    .monitor-frame::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }

    .monitor-frame::before {
      inset: 16px 18px 22px;
      z-index: 2;
      background:
        linear-gradient(118deg, transparent 0 14%, rgba(246, 242, 223, 0.18) 15%, transparent 19%),
        linear-gradient(68deg, transparent 0 74%, rgba(32, 195, 215, 0.16) 75%, transparent 80%);
      mix-blend-mode: screen;
    }

    .monitor-frame::after {
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      background:
        linear-gradient(90deg, transparent 0 48%, rgba(5, 8, 8, 0.86) 48% 51%, transparent 51%),
        linear-gradient(180deg, transparent 0 54%, rgba(5, 8, 8, 0.74) 54% 58%, transparent 58%);
      box-shadow:
        inset 0 0 0 12px rgba(4, 5, 5, 0.72),
        inset 0 0 0 14px rgba(246, 242, 223, 0.12),
        inset 0 -18px 0 rgba(4, 5, 5, 0.82);
    }

    .monitor-image {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: cover;
      object-position: center;
      border: 2px solid rgba(0, 0, 0, 0.76);
      filter: saturate(0.9) contrast(1.05);
    }

    .monitor-readout {
      position: absolute;
      left: 20px;
      right: auto;
      bottom: -18px;
      z-index: 4;
      width: 204px;
      padding: 7px 9px;
      border: 1px solid rgba(3, 5, 7, 0.52);
      background: #decc98;
      color: #17120b;
      font-size: 10px;
      font-weight: 850;
      line-height: 1.25;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.34);
      transform: rotate(-1.2deg);
    }

    .monitor-readout b {
      color: #0c0905;
      font-weight: 950;
    }

    .monitor-states {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .state-button {
      min-height: 44px;
      padding: 7px 8px;
      border: 1px solid rgba(246, 242, 223, 0.16);
      border-radius: 6px;
      background: rgba(5, 8, 11, 0.78);
      color: rgba(246, 242, 223, 0.72);
      font-size: 11px;
      font-weight: 950;
      line-height: 1.15;
      text-align: left;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035);
    }

    .state-button[aria-pressed="true"] {
      border-color: rgba(32, 195, 215, 0.72);
      background: linear-gradient(90deg, rgba(14, 138, 173, 0.46), rgba(237, 56, 45, 0.13));
      color: var(--paper-bright);
    }

    .press-machine {
      position: absolute;
      left: 410px;
      bottom: 164px;
      z-index: 2;
      width: 352px;
      height: 226px;
      padding: 0;
    }

    .press-status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: rgba(246, 242, 223, 0.64);
      font-size: 12px;
      font-weight: 850;
    }

    .press-belts {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 26px;
      height: 108px;
    }

    .roller {
      position: absolute;
      left: 16px;
      right: 16px;
      height: 34px;
      border: 2px solid rgba(246, 242, 223, 0.18);
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.09) 0 5px, transparent 5px 13px),
        linear-gradient(180deg, #303439, #0a0d10);
      box-shadow: inset 0 -9px 18px rgba(0, 0, 0, 0.52);
    }

    .roller.top { top: 4px; }
    .roller.bottom { bottom: 8px; }

    .sheet-feed {
      position: absolute;
      left: 52px;
      top: 28px;
      width: 210px;
      height: 52px;
      border: 2px solid rgba(246, 242, 223, 0.64);
      background:
        linear-gradient(90deg, rgba(237, 56, 45, 0.92) 0 42px, transparent 42px),
        repeating-linear-gradient(0deg, transparent 0 9px, rgba(3, 5, 7, 0.34) 9px 11px),
        #e8d8ae;
      transform: rotate(-3deg);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.34);
    }

    .editor-desk {
      position: absolute;
      left: 118px;
      right: 88px;
      bottom: -96px;
      z-index: 2;
      height: 420px;
    }

    .editor-desk .scene-art {
      object-position: bottom center;
      filter: drop-shadow(0 26px 48px rgba(0, 0, 0, 0.52));
    }

    .cover-sheet {
      position: absolute;
      left: 72px;
      top: 24px;
      width: 294px;
      height: 202px;
      padding: 15px;
      border: 2px solid rgba(3, 5, 7, 0.86);
      background:
        linear-gradient(180deg, rgba(237, 56, 45, 0.92) 0 30px, transparent 30px),
        linear-gradient(90deg, rgba(32, 195, 215, 0.88) 0 60px, transparent 60px),
        #ead9ac;
      color: #111;
      box-shadow:
        8px 8px 0 rgba(32, 195, 215, 0.38),
        18px 18px 0 rgba(237, 56, 45, 0.24),
        0 20px 38px rgba(0, 0, 0, 0.34);
      transform: rotate(-5deg);
    }

    .cover-sheet .issue-no {
      color: rgba(3, 5, 7, 0.72);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 0;
    }

    .cover-sheet h1 {
      margin-top: 22px;
      max-width: 210px;
      color: #080808;
      font-size: 27px;
      font-weight: 950;
      line-height: 1.02;
    }

    .cover-shot {
      position: absolute;
      right: 15px;
      bottom: 18px;
      width: 106px;
      height: 78px;
      border: 3px solid #0c0c0c;
      background:
        radial-gradient(circle at 52% 42%, rgba(237, 56, 45, 0.92) 0 8px, transparent 9px),
        linear-gradient(180deg, #111, #343434);
      box-shadow: inset 0 0 0 7px rgba(255, 255, 255, 0.08);
    }

    .cover-lines {
      position: absolute;
      left: 16px;
      right: 136px;
      bottom: 20px;
      height: 46px;
      background:
        repeating-linear-gradient(0deg, #111 0 4px, transparent 4px 10px);
      opacity: 0.82;
    }

    .stamp-pad {
      position: absolute;
      left: 390px;
      top: 104px;
      display: grid;
      place-items: center;
      width: 126px;
      height: 82px;
      border: 2px solid rgba(237, 56, 45, 0.82);
      border-radius: var(--radius);
      background: rgba(237, 56, 45, 0.16);
      color: #ffd7d3;
      font-size: 17px;
      font-weight: 950;
      line-height: 1.1;
      text-align: center;
      transform: rotate(4deg);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.28);
    }

    .tools-tray {
      position: absolute;
      right: 76px;
      top: 42px;
      display: grid;
      gap: 10px;
      width: 170px;
      transform: rotate(2deg);
    }

    .tool-slip {
      min-height: 36px;
      padding: 8px 10px;
      border-left: 5px solid var(--yellow);
      background: rgba(246, 242, 223, 0.11);
      color: rgba(246, 242, 223, 0.78);
      font-size: 12px;
      font-weight: 850;
      line-height: 1.2;
    }

    .tool-slip:nth-child(2) { border-left-color: var(--cyan); }
    .tool-slip:nth-child(3) { border-left-color: var(--red); }

    .office-command {
      position: relative;
      min-height: 0;
      padding: 22px;
      border: 1px solid rgba(246, 242, 223, 0.18);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(246, 242, 223, 0.055), transparent 34%),
        rgba(5, 8, 11, 0.9);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
    }

    .office-command::before {
      position: absolute;
      inset: 0;
      content: "";
      border-radius: inherit;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.026) 0 1px, transparent 1px 5px);
      pointer-events: none;
    }

    .command-content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 18px;
      height: 100%;
    }

    .command-kicker {
      color: var(--cyan);
      font-size: 12px;
      font-weight: 950;
      text-transform: uppercase;
    }

    .command-title h1 {
      margin-top: 8px;
      color: var(--paper-bright);
      font-size: 34px;
      font-weight: 950;
      line-height: 1.1;
      text-shadow:
        2px -1px 0 rgba(32, 195, 215, 0.32),
        -2px 2px 0 rgba(237, 56, 45, 0.32);
    }

    .command-title p {
      margin-top: 12px;
      color: rgba(246, 242, 223, 0.74);
      font-size: 14px;
      line-height: 1.6;
    }

    .week-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      border: 1px solid rgba(246, 242, 223, 0.14);
      border-radius: var(--radius);
      background: rgba(246, 242, 223, 0.14);
    }

    .week-stat {
      min-height: 74px;

      font-weight: 950;
      text-align: left;

      min-height: 22px;
      color: rgba(32, 195, 215, 0.9);
      font-size: 12px;
      font-weight: 900;
    }

    .letter-layout {
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      gap: 26px;
      align-items: center;
      height: 100%;
    }

    .letter-paper {
      position: relative;
      min-height: 450px;

    .letter-paper img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

    .letter-copy {

      color: #16110a;
      text-shadow: none;

    .letter-copy b {
      display: block;
      color: #15100b;
      font-size: 13px;
      font-weight: 950;

    .letter-copy strong {
      display: block;
      margin-top: 28px;

      font-weight: 950;

    .letter-detail,

      line-height: 1.36;

    .fact-strip span:nth-child(2) { border-left-color: var(--yellow); }

    .broadcast-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 26px;
      align-items: center;
      height: 100%;
    }

    .broadcast-screen {
      position: relative;
      min-height: 420px;
      overflow: hidden;
      border: 1px solid rgba(246, 242, 223, 0.16);
      border-radius: var(--radius);
      background: rgba(3, 5, 7, 0.76);
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.42);
    }

    .broadcast-screen img {
      position: absolute;
      inset: -8px;
      width: calc(100% + 16px);
      height: calc(100% + 16px);
      object-fit: cover;
      filter: saturate(0.95) contrast(1.06);
    }

    .broadcast-lower {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 22px;
      padding: 12px 14px;
      border-left: 6px solid var(--red);

      color: var(--paper-bright);
      font-size: 18px;
      font-weight: 950;
      line-height: 1.25;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.34);
    }

    @media (max-height: 820px) {
      .office-command {
        padding: 18px;
      }

      .command-content {

      }

      .command-title h1 {
        margin-top: 6px;

        line-height: 1.08;
      }

      .command-title p {
        margin-top: 8px;

      .week-stat {

      .todo-card {

        min-height: 410px;
      }

      .broadcast-screen {
        min-height: 370px;
      }
    }
  </style>
</head>

              <span class="action-mark" aria-hidden="true">→</span>
            </a>
            <a class="secondary-action" href="title-screen-homepage-ab-lab.html">
              <span>回到标题页</span>
              <span class="action-mark" aria-hidden="true">↩</span>
            </a>
            <p class="toast" id="toast" aria-live="polite"></p>
          </div>
        </div>
      </aside>
    </section>

    <div class="event-overlay" id="eventOverlay" aria-hidden="true">
      <section class="overlay-shell" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
        <header class="overlay-head">
          <div>
            <p class="overlay-kicker" id="overlayKicker">Desk Queue</p>
            <h2 class="overlay-title" id="overlayTitle">待办</h2>
          </div>
          <button class="overlay-close" type="button" id="overlayClose" aria-label="关闭">×</button>
        </header>
        <div class="overlay-body" id="overlayBody"></div>
      </section>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const toast = document.querySelector("#toast");
    const queueStatus = document.querySelector("#queueStatus");
    const topicBoardArt = document.querySelector("#topicBoardArt");
    const anomalyImage = document.querySelector("#anomalyImage");
    const anomalyReadout = document.querySelector("#anomalyReadout");
    const overlay = document.querySelector("#eventOverlay");
    const overlayKicker = document.querySelector("#overlayKicker");
    const overlayTitle = document.querySelector("#overlayTitle");
    const overlayBody = document.querySelector("#overlayBody");
    const overlayClose = document.querySelector("#overlayClose");
    const artVariants = {
      v2: {
        board: "assets/editorial-office/generated/agenda-blackboard-clean-v2.png",
        window: "assets/editorial-office/generated/window-city-astral-echo-pixel-v2.png"
      },
      v3: {
        board: "assets/editorial-office/generated/agenda-blackboard-empty-pixel-v3.png",
        window: "assets/editorial-office/generated/window-city-astral-echo-pixel-v3.png"
      }
    };
    const artVariant = artVariants[params.get("art")] || artVariants.v2;
    const anomalyStates = {
      ambient: {
        image: "assets/editorial-office/generated/window-city-rain-ambient-v1.png",
        readout: "<b>窗外：雨夜。</b> 蓝光很远，暂时只像天气。"
      },
      astral: {
        image: artVariant.window,
        readout: "<b>特殊景象：第二个月亮。</b> 暂记为彩蛋触发，不占用本周待办位。"
      },
      transit: {
        image: "assets/editorial-office/generated/city-anomaly-transit-rift.png",
        readout: "<b>特殊景象：轨道错位。</b> 只提示地区气味，事件仍等区域选择后显形。"
      },
      signal: {
        image: "assets/editorial-office/generated/city-anomaly-signal-blackout.png",
        readout: "<b>特殊景象：信号遮蔽。</b> 可能是势力压制，也可能只是坏天气。"
      }
    };
    const eventPayloads = {
      science: {
        kicker: "势力传真",
        title: "科学会联络员：标题必须降温",
        mode: "dialogue",
        portrait: "assets/editorial-office/generated/portrait-science-liaison-v1.png",
        quote: "标题里不要再写“活的天气”。公众会把比喻当成预报。",
        detail: "这不是独立剧情线，只是本周开局压力。你的处理方式会写进本周议程，影响天气类选题的公开措辞。",
        choices: [
          { label: "接受措辞限制", result: "已记入议程：天气类标题降低传播，但科学会压力下降。" },
          { label: "追问限制代价", result: "已记入议程：新增一条势力压力线索，本周截稿压力不变。" },
          { label: "先搁置传真", result: "已记入议程：本周压力上升，仍可照常发刊。" }
        ]
      },
      letter: {
        kicker: "读者来信",
        title: "皇后区读者：蓝光回到窗外",
        mode: "letter",
        sender: "皇后区读者 / 匿名",
        quote: "你们上期写的蓝光，我家窗外今晚也有。它不像灯，更像有人把天花板划开了。",
        linked: "关联：上期头版《东海岸蓝光不是海港灯》",
        effect: "后果：归档为下周线索；东海岸地区出现“现实回声”标记。",
        choices: [
          { label: "归档为线索", result: "已处理：来信进入黑板候选线索，下周简报可引用。" },
          { label: "标为公众误读", result: "已处理：减少噪音，但可能错过一条东海岸钩子。" },
          { label: "约读者回访", result: "已处理：生成一个低频来访机会，占用本周一格注意力。" }
        ]
      },
      peddler: {
        kicker: "来访者",
        title: "广告小贩：一盒彩色旧相机",
        mode: "dialogue",
        portrait: "assets/editorial-office/generated/portrait-ad-peddler-v1.png",
        quote: "三台相机，一台拍现在，一台拍昨天，一台专拍没付广告费的真相。",
        detail: "来访和小贩不是办公室经营系统，只是开局事件皮肤。处理结果只影响本周资源、广告压力或一个素材钩子。",
        choices: [
          { label: "买下旧相机", result: "已处理：获得一格异常照片素材，小贩广告条件进入待审。" },
          { label: "只收名片", result: "已处理：来访跨周保留，但下周报价上涨。" },
          { label: "拒绝夹带广告", result: "已处理：版面保持干净，本周少一个便宜素材来源。" }
        ]
      },
      broadcast: {
        kicker: "世界回响",
        title: "深夜城市频道：普通蓝光特别报道",
        mode: "broadcast",
        image: "assets/editorial-office/generated/tv-broadcast-crt-component-v1.png",
        quote: "地方台连续三次把红月切成广告，主持人仍坚持：东海岸蓝光只是摄像机故障。",
        detail: "电视只给一条强回响，不做频道系统。它把上期刊发造成的现实变化变成一张可截图的插页。",
        choices: [
          { label: "记录为世界回响", result: "已记录：本周简报可显示一条广播摘录。" },
          { label: "剪下字幕条", result: "已记录：获得一个传播素材钩子。" },
          { label: "关掉电视", result: "已关闭：不改变本周待办。" }
        ]
      }
    };

    if (params.get("capture") === "clean") {
      document.body.classList.add("clean-capture");
    }

    topicBoardArt.src = artVariant.board;

    function setAnomalyState(stateKey) {
      const state = anomalyStates[stateKey];
      if (!state) return;
        anomalyImage.src = state.image;
        anomalyReadout.innerHTML = state.readout;
      document.querySelectorAll(".state-button").forEach((item) => {
        item.setAttribute("aria-pressed", String(item.dataset.state === stateKey));
      });
    }

    setAnomalyState(params.get("state") || "ambient");

    document.querySelectorAll(".state-button").forEach((button) => {
      button.addEventListener("click", () => {
        setAnomalyState(button.dataset.state);
      });
    });

    function renderChoices(payload, eventKey) {
      return `
        <div class="choice-row">
          ${payload.choices.map((choice) => `
            <button class="choice-button" type="button" data-choice-result="${choice.result}" data-event-key="${eventKey}">
              ${choice.label}
            </button>
          `).join("")}
        </div>
        <p class="choice-result" id="choiceResult" aria-live="polite"></p>
      `;
    }

    function renderDialogue(payload, eventKey) {
      return `
        <div class="dialogue-layout">
          <div class="portrait-stage">
            <img src="${payload.portrait}" alt="" aria-hidden="true" draggable="false" />
          </div>
          <div class="dialogue-card">
            <blockquote>“${payload.quote}”</blockquote>
            <p>${payload.detail}</p>
            ${renderChoices(payload, eventKey)}
          </div>
        </div>
      `;
    }

    function renderLetter(payload, eventKey) {
      return `
        <div class="letter-layout">
          <div class="letter-paper">
            <img src="assets/editorial-office/generated/reader-letter-sheet-v1.png" alt="" aria-hidden="true" draggable="false" />
            <div class="letter-copy">
              <b>${payload.sender}</b>
              <strong>“${payload.quote}”</strong>
              <span>${payload.linked}<br />${payload.effect}</span>
            </div>
          </div>
          <div class="letter-detail">
            <p>来信是发刊回响的薄层反馈牌，不是独立收件箱。它只把读者误读、现实回声和下一周钩子接回本周议程。</p>
            <div class="fact-strip">
              <span>${payload.linked}</span>
              <span>${payload.effect}</span>
              <span>期限：本周不拆会消失。</span>
            </div>
            ${renderChoices(payload, eventKey)}
          </div>
        </div>
      `;
    }

    function renderBroadcast(payload, eventKey) {
      return `
        <div class="broadcast-layout">
          <div class="broadcast-screen">
            <img src="${payload.image}" alt="" aria-hidden="true" draggable="false" />
            <div class="broadcast-lower">${payload.quote}</div>
          </div>
          <div class="broadcast-detail">
            <p>${payload.detail}</p>
            <div class="fact-strip">
              <span>频道：深夜城市频道</span>
              <span>关联：上期蓝光头版</span>
              <span>结果：可进入本周简报，不新增电视系统。</span>
            </div>
            ${renderChoices(payload, eventKey)}
          </div>
        </div>
      `;
    }

    function updateQueueStatus() {
      const remaining = document.querySelectorAll(".todo-card:not(.is-done)").length;
      const must = document.querySelectorAll(".todo-card.must:not(.is-done)").length;
      queueStatus.innerHTML = `还有 <strong>${remaining}</strong> 件未处理，其中 <strong>${must}</strong> 件今日必须。进入编辑会前会再次确认。`;
    }

    function markDone(eventKey) {
      const card = document.querySelector(`.todo-card[data-event="${eventKey}"]`);
      if (!card || card.classList.contains("is-done")) return;
      card.classList.add("is-done");
      updateQueueStatus();
    }

    function openEvent(eventKey) {
      const payload = eventPayloads[eventKey];
      if (!payload) return;
      overlayKicker.textContent = payload.kicker;
      overlayTitle.textContent = payload.title;
      if (payload.mode === "letter") {
        overlayBody.innerHTML = renderLetter(payload, eventKey);
      } else if (payload.mode === "broadcast") {
        overlayBody.innerHTML = renderBroadcast(payload, eventKey);
      } else {
        overlayBody.innerHTML = renderDialogue(payload, eventKey);
      }
      overlay.classList.add("is-open");
      overlay.setAttribute("aria-hidden", "false");
      overlayClose.focus();
    }

    function closeEvent() {
      overlay.classList.remove("is-open");
      overlay.setAttribute("aria-hidden", "true");
    }

    document.querySelectorAll("[data-event]").forEach((trigger) => {
      trigger.addEventListener("click", () => {
        openEvent(trigger.dataset.event);
      });
    });

    overlayBody.addEventListener("click", (event) => {
      const button = event.target.closest(".choice-button");
      if (!button) return;
      const result = document.querySelector("#choiceResult");
      result.textContent = button.dataset.choiceResult;
      if (button.dataset.eventKey !== "broadcast") {
        markDone(button.dataset.eventKey);
      }
      toast.textContent = result.textContent;
    });

    overlayClose.addEventListener("click", closeEvent);
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closeEvent();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeEvent();
    });

    document.querySelector("#briefingButton").addEventListener("click", (event) => {
      event.preventDefault();
      const must = document.querySelectorAll(".todo-card.must:not(.is-done)").length;
      if (must > 0) {
        toast.textContent = "还有今日必须事项未处理：科学会传真会在进入编辑会前再次弹出。";
        openEvent("science");
        return;
      }
      toast.textContent = "本周编辑会稍后接入：待办处理结果已整理进议程草稿。";
    });

    updateQueueStatus();

    if (params.get("event")) {
      openEvent(params.get("event"));
    }
  </script>
</body>
</html>
