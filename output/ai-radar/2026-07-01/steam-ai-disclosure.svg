<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg{fill:#fffaf0}.ink{fill:#111827}.muted{fill:#475569}.teal{fill:#0f766e}.blue{fill:#1d4ed8}.orange{fill:#c2410c}.red{fill:#b91c1c}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}.soft{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.strip{fill:#fff7ed;stroke:#fed7aa;stroke-width:2}
      .title{font:700 54px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif}.sub{font:700 34px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif}
      .h{font:700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif}.body{font:500 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif}
      .small{font:500 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif}.num{font:700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;fill:white}
    </style>
  </defs>
  <rect width="1600" height="900" class="bg"/>
  <text x="42" y="70" class="title ink">每日 AI 新工具｜Steam AI 内容规则</text>
  <text x="42" y="124" class="sub teal">今日重点：AI 可以提效，但玩家看到的内容要能交代</text>
  <rect x="42" y="155" width="520" height="62" rx="14" class="soft"/><text x="72" y="195" class="body ink">规则名：<tspan class="teal" font-weight="700">Steamworks AI 内容披露</tspan></text>
  <rect x="590" y="155" width="380" height="62" rx="14" class="soft"/><text x="620" y="195" class="body ink">类型：平台规则 / 商用风险</text>
  <rect x="998" y="155" width="300" height="62" rx="14" class="soft"/><text x="1028" y="195" class="body ink">动作：<tspan class="red" font-weight="700">长期采用</tspan></text>

  <rect x="42" y="250" width="455" height="395" rx="18" class="card"/>
  <circle cx="86" cy="292" r="26" fill="#0f766e"/><text x="78" y="301" class="num">1</text><text x="124" y="302" class="h teal">它是什么</text>
  <text x="72" y="360" class="body ink">• 不是 AI 工具，而是 Steam 内容披露规则</text>
  <text x="72" y="408" class="body ink">• 关注最终交付给玩家的 AI 内容</text>
  <text x="72" y="456" class="body ink">• 区分开发中使用和玩家可见内容</text>
  <rect x="100" y="510" width="310" height="86" rx="14" fill="#ecfeff" stroke="#99f6e4" stroke-width="2"/>
  <text x="126" y="562" class="body teal" font-weight="700">目标：让内容来源可交代</text>

  <rect x="535" y="250" width="515" height="395" rx="18" class="card"/>
  <circle cx="579" cy="292" r="26" fill="#1d4ed8"/><text x="571" y="301" class="num">2</text><text x="617" y="302" class="h blue">风险边界</text>
  <rect x="575" y="340" width="205" height="240" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="602" y="380" class="body teal" font-weight="700">内部开发使用</text>
  <text x="600" y="430" class="small ink">草图 / 草案</text>
  <text x="600" y="470" class="small ink">Prompt 探索</text>
  <text x="600" y="510" class="small ink">测试与效率工具</text>
  <text x="600" y="550" class="small ink">不直接交付玩家</text>
  <text x="802" y="465" class="h orange">≠</text>
  <rect x="845" y="340" width="180" height="240" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="875" y="380" class="body orange" font-weight="700">玩家可见内容</text>
  <text x="872" y="430" class="small ink">最终美术 / 声音</text>
  <text x="872" y="470" class="small ink">商店图 / 宣传片</text>
  <text x="872" y="510" class="small ink">运行时生成内容</text>
  <text x="872" y="550" class="small ink">需记录和披露</text>

  <rect x="1088" y="250" width="470" height="395" rx="18" class="card"/>
  <circle cx="1132" cy="292" r="26" fill="#c2410c"/><text x="1124" y="301" class="num">3</text><text x="1170" y="302" class="h orange">典型例子</text>
  <text x="1120" y="365" class="body ink">内部草图：</text><text x="1250" y="365" class="body muted">AI 探索角色方向，只作参考</text>
  <text x="1120" y="430" class="body ink">正式素材：</text><text x="1250" y="430" class="body muted">AI 头像进游戏，要审美和记录</text>
  <text x="1120" y="500" class="body ink">运行时生成：</text><text x="1270" y="500" class="body muted">需要 guardrails 说明</text>
  <rect x="1120" y="560" width="380" height="48" rx="10" fill="#fee2e2"/><text x="1145" y="592" class="small red" font-weight="700">合规只是底线，玩家观感更重要</text>

  <rect x="42" y="675" width="1516" height="145" rx="18" class="strip"/>
  <text x="72" y="730" class="h ink">制作人判断</text>
  <text x="250" y="724" class="body ink">Angus 可以大胆用 AI 做草图、测试和流程提效；但角色、美术、商店图、</text>
  <text x="250" y="766" class="body ink">宣传片等玩家可见资产，必须经过人工修正、风格守门和来源记录。</text>
  <text x="250" y="808" class="body red" font-weight="700">不能让 AI 产物直接滑进正式素材库。</text>
</svg>
