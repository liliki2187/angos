<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 16px; fill: #62625e; }
      .panel-title { font-size: 22px; font-weight: 800; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; }
      .muted { fill: #6b6b66; }
      .mono { font-family: Consolas, monospace; }
      .bold { font-weight: 800; }
      .line { stroke: #111; stroke-width: 2; fill: none; }
      .thin { stroke: #666; stroke-width: 1.25; fill: none; }
      .dash { stroke: #777; stroke-width: 1.25; stroke-dasharray: 6 5; fill: none; }
      .white { fill: #fff; }
      .paper { fill: #f3f3f0; }
      .soft { fill: #e7e7e2; }
      .ink { fill: #111; }
      .inverse { fill: #fff; }
    </style>

    <g id="thumb">
      <rect width="46" height="46" class="thin soft"/>
      <path d="M0 0 L46 46 M46 0 L0 46" class="thin"/>
    </g>

    <g id="card-a04">
      <rect width="274" height="62" class="white" stroke="#111" stroke-width="2.5"/>
      <use href="#thumb" x="8" y="8"/>
      <text x="64" y="16" class="tiny mono muted bold">A04</text>
      <text x="64" y="34" class="small bold">罗斯威尔档案第十四页拒绝被复印</text>
      <text x="64" y="51" class="tiny muted">档案 · 怀疑 · 430</text>
      <rect x="225" y="43" width="40" height="14" class="white" stroke="#111"/>
      <text x="245" y="53" class="tiny bold" text-anchor="middle">选中</text>
    </g>

    <g id="card-a07">
      <rect width="274" height="62" class="white" stroke="#666" stroke-width="1.25"/>
      <use href="#thumb" x="8" y="8"/>
      <text x="64" y="16" class="tiny mono muted bold">A07</text>
      <text x="64" y="34" class="small bold">北岸气象塔整夜接收来自地下的闪电</text>
      <text x="64" y="51" class="tiny muted">科学 · 怀疑 · 360</text>
    </g>

    <g id="card-a08">
      <rect width="274" height="62" class="white" stroke="#666" stroke-width="1.25"/>
      <use href="#thumb" x="8" y="8"/>
      <text x="64" y="16" class="tiny mono muted bold">A08</text>
      <text x="64" y="34" class="small bold">旧城区每一面停摆时钟同时快了四分钟</text>
      <text x="64" y="51" class="tiny muted">目击 · 中立 · 350</text>
    </g>

    <g id="callout1">
      <circle r="13" class="ink"/>
      <text y="5" text-anchor="middle" class="small inverse bold">1</text>
    </g>
    <g id="callout2">
      <circle r="13" class="ink"/>
      <text y="5" text-anchor="middle" class="small inverse bold">2</text>
    </g>
    <g id="callout3">
      <circle r="13" class="ink"/>
      <text y="5" text-anchor="middle" class="small inverse bold">3</text>
    </g>
    <g id="callout4">
      <circle r="13" class="ink"/>
      <text y="5" text-anchor="middle" class="small inverse bold">4</text>
    </g>
    <g id="callout5">
      <circle r="13" class="ink"/>
      <text y="5" text-anchor="middle" class="small inverse bold">5</text>
    </g>
    <g id="callout6">
      <circle r="13" class="ink"/>
      <text y="5" text-anchor="middle" class="small inverse bold">6</text>
    </g>
    <g id="callout7">
      <circle r="13" class="ink"/>
      <text y="5" text-anchor="middle" class="small inverse bold">7</text>
    </g>
    <g id="callout8">
      <circle r="13" class="ink"/>
      <text y="5" text-anchor="middle" class="small inverse bold">8</text>
    </g>
  </defs>

  <rect width="1600" height="1000" class="paper"/>
  <line x1="52" y1="0" x2="52" y2="1000" stroke="#c7c7c1"/>

  <text x="52" y="62" class="title">候选报道筛选与排序｜局部功能解说图</text>
  <text x="52" y="91" class="subtitle">黑白结构稿 v0 · 只说明功能与状态，不代表最终美术包装</text>
  <rect x="1294" y="46" width="254" height="42" class="white" stroke="#111" stroke-width="2"/>
  <text x="1421" y="73" text-anchor="middle" class="body bold">审阅目标：是否冻结进 v4</text>
  <line x1="52" y1="111" x2="1548" y2="111" stroke="#111" stroke-width="4"/>

  <!-- STATE 01 -->
  <g transform="translate(52 136)">
    <rect width="728" height="350" class="white" stroke="#111" stroke-width="2"/>
    <text x="690" y="25" text-anchor="end" class="small mono muted bold">STATE 01</text>

    <g transform="translate(18 18)">
      <rect width="314" height="314" class="paper" stroke="#111" stroke-width="2"/>
      <g transform="translate(15 15)">
        <rect width="284" height="46" class="white"/>
        <line x1="0" y1="46" x2="284" y2="46" stroke="#111" stroke-width="2"/>
        <text x="4" y="29" class="body bold">候选报道</text>
        <text x="95" y="29" class="small muted">20篇</text>
        <rect x="152" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <rect x="196" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <rect x="240" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <text x="174" y="29" text-anchor="middle" class="small bold">搜</text>
        <text x="218" y="29" text-anchor="middle" class="small bold">筛</text>
        <text x="262" y="29" text-anchor="middle" class="small bold">序</text>
        <circle cx="233" cy="8" r="8" class="ink"/>
        <text x="233" y="12" text-anchor="middle" class="tiny inverse bold">2</text>
      </g>
      <use href="#card-a04" x="15" y="76"/>
      <use href="#card-a07" x="15" y="146"/>
      <use href="#card-a08" x="15" y="216"/>
      <rect x="15" y="279" width="274" height="25" fill="url(#none)"/>
      <text x="152" y="299" text-anchor="middle" class="body mono muted bold">···</text>
    </g>

    <g transform="translate(362 48)">
      <text class="panel-title">默认态：入口压进原栏头</text>
      <use href="#callout1" x="13" y="53"/>
      <text x="39" y="50" class="body">搜索、筛选、排序都使用 44×44px 热区；</text>
      <text x="39" y="71" class="body">不会再增加第二行工具条。</text>
      <use href="#callout2" x="13" y="108"/>
      <text x="39" y="105" class="body">数量显示“命中 / 总数”；筛选角标显示</text>
      <text x="39" y="126" class="body">当前生效条件数。</text>
      <line x1="0" y1="157" x2="330" y2="157" stroke="#aaa"/>
      <text x="0" y="184" class="small muted">列表仍从原来的 y=80 开始，卡片尺寸不变。</text>
      <text x="0" y="205" class="small muted">默认状态仍完整显示 8 张报道。</text>
    </g>
  </g>

  <!-- STATE 02 -->
  <g transform="translate(820 136)">
    <rect width="728" height="350" class="white" stroke="#111" stroke-width="2"/>
    <text x="690" y="25" text-anchor="end" class="small mono muted bold">STATE 02</text>

    <g transform="translate(18 18)">
      <rect width="314" height="314" class="paper" stroke="#111" stroke-width="2"/>
      <g transform="translate(15 15)">
        <rect width="240" height="46" class="white" stroke="#111" stroke-width="2"/>
        <text x="13" y="29" class="body bold">⌕</text>
        <text x="36" y="29" class="body">档案</text>
        <text x="225" y="29" text-anchor="end" class="small mono muted bold">3/20</text>
        <rect x="240" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <text x="262" y="31" text-anchor="middle" class="panel-title">×</text>
      </g>
      <use href="#card-a04" x="15" y="76"/>
      <g transform="translate(15 146)">
        <rect width="274" height="62" class="white" stroke="#666" stroke-width="1.25"/>
        <use href="#thumb" x="8" y="8"/>
        <text x="64" y="16" class="tiny mono muted bold">A09</text>
        <text x="64" y="34" class="small bold">无人值守照相馆洗出明天的团体合影</text>
        <text x="64" y="51" class="tiny muted">档案 · 猎奇 · 340</text>
      </g>
      <g transform="translate(15 216)">
        <rect width="274" height="62" class="white" stroke="#666" stroke-width="1.25"/>
        <use href="#thumb" x="8" y="8"/>
        <text x="64" y="16" class="tiny mono muted bold">A10</text>
        <text x="64" y="34" class="small bold">档案室新抽屉只收纳尚未发生的投诉</text>
        <text x="64" y="51" class="tiny muted">档案 · 中立 · 320</text>
      </g>
    </g>

    <g transform="translate(362 48)">
      <text class="panel-title">搜索态：栏头原位切换</text>
      <use href="#callout3" x="13" y="53"/>
      <text x="39" y="50" class="body">只搜索标题和题材标签；输入时立即刷新。</text>
      <text x="39" y="71" class="body">右侧显示“命中数 / 总数”。</text>
      <use href="#callout4" x="13" y="108"/>
      <text x="39" y="105" class="body">关闭后恢复标题与三个入口；列表从始至终</text>
      <text x="39" y="126" class="body">不下移、不改变中间双页。</text>
      <line x1="0" y1="157" x2="330" y2="157" stroke="#aaa"/>
      <text x="0" y="184" class="small muted">搜索和筛选只改变左栏可见集合，</text>
      <text x="0" y="205" class="small muted">不会触发签发推演重算。</text>
    </g>
  </g>

  <!-- STATE 03 -->
  <g transform="translate(52 506)">
    <rect width="728" height="350" class="white" stroke="#111" stroke-width="2"/>
    <text x="690" y="25" text-anchor="end" class="small mono muted bold">STATE 03</text>

    <g transform="translate(18 18)">
      <rect width="314" height="314" class="paper" stroke="#111" stroke-width="2"/>
      <g transform="translate(15 15)">
        <rect width="284" height="46" class="white"/>
        <line x1="0" y1="46" x2="284" y2="46" stroke="#111" stroke-width="2"/>
        <text x="4" y="29" class="body bold">候选报道</text>
        <text x="95" y="29" class="small muted">6/20</text>
        <rect x="152" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <rect x="196" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <rect x="240" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <text x="174" y="29" text-anchor="middle" class="small bold">搜</text>
        <text x="218" y="29" text-anchor="middle" class="small bold">筛</text>
        <text x="262" y="29" text-anchor="middle" class="small bold">序</text>
      </g>
      <use href="#card-a07" x="15" y="76" opacity=".45"/>
      <use href="#card-a08" x="15" y="146" opacity=".45"/>

      <g transform="translate(15 64)">
        <rect width="284" height="236" class="white" stroke="#111" stroke-width="3"/>
        <rect x="7" y="7" width="284" height="236" fill="none" stroke="#aaa" stroke-width="5" opacity=".55"/>
        <text x="14" y="28" class="body bold">筛选 · 即时生效</text>
        <text x="267" y="29" text-anchor="middle" class="panel-title">×</text>
        <line x1="14" y1="39" x2="270" y2="39" stroke="#111" stroke-width="2"/>

        <text x="14" y="60" class="small bold">稿型</text>
        <rect x="14" y="68" width="68" height="24" class="soft" stroke="#666"/>
        <rect x="87" y="68" width="68" height="24" class="ink"/>
        <rect x="160" y="68" width="68" height="24" class="soft" stroke="#666"/>
        <text x="48" y="84" text-anchor="middle" class="tiny">抢先快讯</text>
        <text x="121" y="84" text-anchor="middle" class="tiny inverse bold">深度报道</text>
        <text x="194" y="84" text-anchor="middle" class="tiny">个人专栏</text>

        <text x="14" y="112" class="small bold">公开取向</text>
        <rect x="14" y="120" width="60" height="24" class="soft" stroke="#666"/>
        <rect x="79" y="120" width="60" height="24" class="ink"/>
        <rect x="144" y="120" width="60" height="24" class="soft" stroke="#666"/>
        <rect x="209" y="120" width="61" height="24" class="soft" stroke="#666"/>
        <text x="44" y="136" text-anchor="middle" class="tiny">科学纪实</text>
        <text x="109" y="136" text-anchor="middle" class="tiny inverse bold">神秘玄学</text>
        <text x="174" y="136" text-anchor="middle" class="tiny">世俗流量</text>
        <text x="239" y="136" text-anchor="middle" class="tiny">无公开取向</text>

        <text x="14" y="165" class="small bold">主题</text>
        <rect x="61" y="150" width="209" height="25" class="soft" stroke="#666"/>
        <text x="72" y="167" class="tiny">全部主题</text>
        <text x="258" y="167" text-anchor="middle" class="small">⌄</text>

        <line x1="14" y1="188" x2="270" y2="188" stroke="#999"/>
        <text x="14" y="207" class="small bold">更多条件</text>
        <text x="270" y="207" text-anchor="end" class="small muted">质量 · 有效值⌄</text>
        <text x="14" y="226" class="tiny muted" text-decoration="underline">清除全部筛选</text>
      </g>
    </g>

    <g transform="translate(362 48)">
      <text class="panel-title">筛选态：浮层覆盖列表</text>
      <use href="#callout5" x="13" y="53"/>
      <text x="39" y="50" class="body">首层只展开稿型、公开取向、主题，</text>
      <text x="39" y="71" class="body">不让 288px 左栏变成后台表单。</text>
      <use href="#callout6" x="13" y="108"/>
      <text x="39" y="105" class="body">质量与有效值折叠到“更多条件”；</text>
      <text x="39" y="126" class="body">不再添加“应用 / 完成”按钮。</text>
      <line x1="0" y1="157" x2="330" y2="157" stroke="#aaa"/>
      <text x="0" y="184" class="small muted">×、Esc、点击外部均可关闭。</text>
      <text x="0" y="205" class="small muted">筛选浮层与排序菜单互斥。</text>
    </g>
  </g>

  <!-- STATE 04 -->
  <g transform="translate(820 506)">
    <rect width="728" height="350" class="white" stroke="#111" stroke-width="2"/>
    <text x="690" y="25" text-anchor="end" class="small mono muted bold">STATE 04</text>

    <g transform="translate(18 18)">
      <rect width="314" height="314" class="paper" stroke="#111" stroke-width="2"/>
      <g transform="translate(15 15)">
        <rect width="284" height="46" class="white"/>
        <line x1="0" y1="46" x2="284" y2="46" stroke="#111" stroke-width="2"/>
        <text x="4" y="18" class="small bold">已选 A04 被隐藏</text>
        <text x="4" y="36" class="small bold" text-decoration="underline">显示并定位</text>
        <rect x="152" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <rect x="196" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <rect x="240" y="1" width="44" height="44" class="soft" stroke="#111"/>
        <text x="174" y="29" text-anchor="middle" class="small bold">搜</text>
        <text x="218" y="29" text-anchor="middle" class="small bold">筛</text>
        <text x="262" y="29" text-anchor="middle" class="small bold">序</text>
      </g>
      <use href="#card-a07" x="15" y="76"/>
      <use href="#card-a08" x="15" y="146"/>

      <g transform="translate(118 63)">
        <rect width="181" height="162" class="white" stroke="#111" stroke-width="3"/>
        <rect x="7" y="7" width="181" height="162" fill="none" stroke="#aaa" stroke-width="5" opacity=".55"/>
        <rect x="0" y="0" width="181" height="40" class="soft"/>
        <text x="13" y="25" class="small bold">默认顺序</text>
        <text x="165" y="25" text-anchor="middle" class="small bold">✓</text>
        <line x1="0" y1="40" x2="181" y2="40" stroke="#aaa"/>
        <text x="13" y="65" class="small">有效值高到低</text>
        <text x="165" y="65" text-anchor="middle" class="small">↓</text>
        <line x1="0" y1="80" x2="181" y2="80" stroke="#aaa"/>
        <text x="13" y="105" class="small">质量高到低</text>
        <text x="165" y="105" text-anchor="middle" class="small">↓</text>
        <line x1="0" y1="120" x2="181" y2="120" stroke="#aaa"/>
        <text x="13" y="145" class="small">标题顺序</text>
        <text x="165" y="145" text-anchor="middle" class="small">A</text>
      </g>
    </g>

    <g transform="translate(362 48)">
      <text class="panel-title">状态保护：选择不会丢失</text>
      <use href="#callout7" x="13" y="53"/>
      <text x="39" y="50" class="body">选中项被过滤时继续保留选择，栏头</text>
      <text x="39" y="71" class="body">明确提示，并提供“显示并定位”。</text>
      <use href="#callout8" x="13" y="108"/>
      <text x="39" y="105" class="body">只有显式选择排序时才重排；默认保持</text>
      <text x="39" y="126" class="body">候选池原始顺序。</text>
      <line x1="0" y1="157" x2="330" y2="157" stroke="#aaa"/>
      <text x="0" y="184" class="small muted">临时显示期间若再改条件，立即退出临时态，</text>
      <text x="0" y="205" class="small muted">以最新搜索 / 筛选条件为准。</text>
    </g>
  </g>

  <g transform="translate(52 878)">
    <rect width="1496" height="88" class="ink"/>
    <text x="24" y="35" class="panel-title inverse">建议冻结进 v4</text>
    <text x="24" y="61" class="small inverse">通过后再落入交互原型。</text>
    <text x="300" y="31" class="body inverse bold">✓ 不增加常驻高度，8 张卡仍完整可见</text>
    <text x="300" y="59" class="body inverse bold">✓ 搜索 / 筛选不触发重算，替换后才重算</text>
    <text x="850" y="31" class="body inverse bold">✓ 12 / 20+ 条继续仅左栏滚动，不分页</text>
    <text x="850" y="59" class="body inverse bold">✓ 不改双页、签发链和唯一送印 CTA</text>
  </g>
</svg>
