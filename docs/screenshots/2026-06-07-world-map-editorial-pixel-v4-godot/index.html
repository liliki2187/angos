<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Godot 世界地图编辑部像素 v4 验收</title>
  <style>
    body {
      margin: 0;
      background: #0b1014;
      color: #efe7bf;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p {
      margin: 0 0 22px;
      color: #84d7dc;
    }
    section {
      margin: 0 0 28px;
      border: 1px solid rgba(132, 215, 220, 0.35);
      background: rgba(2, 8, 10, 0.72);
      padding: 14px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(239, 231, 191, 0.22);
    }
  </style>

<body>
  <main>
    <h1>Godot 世界地图编辑部像素 v4 验收</h1>
    <p>桌面 16:9，1920 × 1080。重点验证：不再回退到旧简陋底图，中央地图和左右栏空区被编辑部物件与有效信息填充。</p>

    <section>
      <h2>01 世界地图 / 区域选择</h2>
      <img src="01-world-map-region-select.png" alt="世界地图区域选择截图">
    </section>

    <section>
      <h2>02 区域任务台</h2>
      <img src="02-region-task-board.png" alt="区域任务台截图">

    <section>
      <h2>03 派遣签批台 / 连续追踪</h2>

    </section>

    <section>
      <h2>04 派遣签批台 / 限时截稿</h2>
      <img src="04-dispatch-desk-deadline.png" alt="派遣签批台限时截稿截图">
