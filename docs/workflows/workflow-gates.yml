# Lightweight workflow gate table for Angus.
# This file is intentionally simple so it can become script input later.
#
# 真源分工（2026-07-08 起）：
# - 本文件是产物类型（artifact_types）、阶段跳转（stage_transitions）与 hard gate 的机器可读真源。
# - docs/onboarding/assetized-ui-production-chain.md 负责资产化 UI 的操作细则与解释。
# - docs/workflows/angus-workflow-harness.md 负责风险分级、回复格式与 loop 生命周期。
# - docs/workflows/ui-geometry-and-text-safety-gates.md 负责几何 / 正交 / 文字安全的统一阈值。
# - 新增或修改 gate 必须同时落本文件与对应文档，只落一处视为未生效。

risk_levels:
  tiny:
    default_required:
      - concise_summary
    default_not_required:
      - router_card
      - subagent_review
      - screenshot
  normal:
    default_required:
      - decision_strip
      - human_brief
      - router_card
      - task_specific_validation
      # trial 2026-07-08（A165 二次复发升级律配套）：交付前三问
      # 1 产物诚实（F1）2 范围一致（F3）3 同类扫描（F4），详见 harness Level 1
      - pre_delivery_three_questions
  risky:
    default_required:
      - decision_strip
      - human_brief
      - router_card
      - delivery_manifest
      - relevant_source_read
      - target_specific_gate
      - screenshot_or_test_evidence
  production:
    default_required:
      - decision_strip
      - human_brief
      - router_card
      - delivery_manifest
      - relevant_source_read
      - required_subagent_review
      - hard_gate
      - screenshot_or_test_evidence
      - drift_check
  experimental:
    default_required:
      - decision_strip
      - human_brief
      - narrow_question
      - minimum_output
      - stop_condition
      - non_source_status_label

feedback_contract:
  applies_to_modes:
    - workflow_gate
    - loop_log
    - blocked_or_user_decision
    - pass_fail_judgment
  not_for_modes:
    - direct_answer
    - completion_report
    - progress_update
    - casual_discussion
  required_order:
    - decision_status
    - user_impact
    - concrete_next_action
  max_decision_lines: 3
  detail_order_after_decision:
    - actual_work_done
    - current_blocker
    - blocker_reason
    - minimum_next_validation
    - do_not_do_this_round
  max_brief_bullets: 5
  plain_language_rules:
    - decision_strip_before_human_brief
    - no_jargon_as_main_subject
    - jargon_only_in_parentheses_or_detail_layer
    - explain_user_action_before_gate_names
    - state_actual_done_separately_from_planned_next
  detail_after_brief:
    - router_card
    - delivery_manifest
    - loop_log
    - gate_checklist
  blockers:
    - decision_strip_used_for_ordinary_reply
    - checklist_without_conclusion
    - human_brief_before_decision_strip
    - jargon_first_response
    - human_brief_as_field_dump
    - planned_work_written_as_done
    - gate_name_without_user_action
    - mixed_current_deliverable_and_routed_artifact

loop_log_contract:
  auto_required_when:
    user_message_contains_any_of:
      - 这次错在
      - 哪里错了
      - 为什么还是
      - 为什么又
      - 复盘
      - 怎么避免
      - 防复发
      - 先别落地
      - 不要继续
      - 不改文件
      - 错题本
      - 这个要进错题本
      - 转成 eval case
      - workflow 没跑完整
      - 没触发 gate
      - 没有按流程
      - 你误判了
      - 你跳步了
      - 你漏调 agent
      - 你乱调 agent
    system_or_self_detects_any_of:
      - delivery_claim_retracted
      - user_corrects_pass_fail_judgment
      - stage_transition_was_wrong
      - artifact_type_was_overclaimed
      - required_gate_was_missing
      - required_evidence_was_missing
      - required_agent_was_missing
      - unnecessary_agent_was_called
      - final_answer_was_unreadable
      - implementation_started_after_user_requested_no_implementation
  required_sections:
    - decision_strip
    - trigger_source
    - original_problem
    - failure_cause
    # trial 2026-07-08（A165）：先查 guidance §7.0 错误家族索引做复发判定；
    # 同族第二次复发时沉淀判断必须按 harness §5.2 升级防线，不得只补文档规则。
    - recurrence_check
    - current_handling
    - recurrence_protection
    - sedimentation_decision
  blockers:
    - apology_without_loop_log
    - explanation_without_failure_cause
    - future_rule_without_current_handling
    - no_sedimentation_decision_for_repeatable_error
    - user_requested_no_file_changes_but_files_changed
    - loop_log_missing_decision_strip

artifact_types:
  structure_wireframe:
    proves:
      - functional_partition
      - rough_capacity
    cannot_claim:
      - visual_pass
      - production_candidate
      - cuttable_assets
  problem_overlay:
    proves:
      - problem_layer
      - target_layer
    cannot_claim:
      - real_ui_effect
      - runtime_pass
  interaction_fix_sketch:
    proves:
      - operation_relationship
      - local_correction
    cannot_claim:
      - filled_state_text_mock
      - no_text_asset_master
  safe_zone_capacity_validation:
    proves:
      - text_capacity
      - rect_pressure
    cannot_claim:
      - typography_integration
      - formal_ui_quality
  logic_smoke:
    proves:
      - p0_condition_triggered
      - blocker_or_state_machine_runs
    cannot_claim:
      - visual_acceptance
      - target_ui_landed
  visual_style_reference:
    proves:
      - style_potential
      - material_direction
    cannot_claim:
      - functional_capacity
      - dynamic_text_fit
  color_locked_style_draft:
    proves:
      - color_contract_stage_passed
    cannot_claim:
      - asset_split_ready
      - production_candidate
  no_text_style_draft:
    proves:
      - no_text_composition
      - writable_area_direction
    cannot_claim:
      - real_content_screenshot
      - runtime_background
  filled_state_text_mock:
    proves:
      - text_image_integration
      - information_density
      - typography_mood
    cannot_claim:
      - manifest_source
      - runtime_background
  component_aspect_taxonomy:
    proves:
      - role_based_shape_families
      - square_permission_per_role
    cannot_claim:
      - class_contract
      - cuttable_assets
      - production_candidate
  component_class_contract:
    proves:
      - normalized_export_size_and_slots
      - state_skins_share_geometry
      - resolution_and_export_scale_declared
    cannot_claim:
      - final_art
      - atlas_ready
      - runtime_pass
  full_screen_reinsert_proof:
    proves:
